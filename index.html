<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS O.S. - Voice Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050811;
            color: #00f0ff;
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Haupt-Interface (Links) */
        #main-interface {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px;
            position: relative;
        }

        /* Sci-Fi HUD Logo (Mitte) */
        .hud-container {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 40px;
        }

        .hud-ring-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px dashed rgba(0, 240, 255, 0.4);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .hud-ring-inner {
            position: absolute;
            width: 75%;
            height: 75%;
            border: 2px solid #00f0ff;
            border-left-color: transparent;
            border-right-color: transparent;
            border-radius: 50%;
        }

        .hud-core {
            width: 45%;
            height: 45%;
            background: radial-gradient(circle, #00f0ff 0%, rgba(0, 240, 255, 0.1) 70%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px #00f0ff;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .hud-core:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px #00f0ff;
        }

        .hud-core.listening {
            background: radial-gradient(circle, #ff0055 0%, rgba(ff, 0, 85, 0.2) 70%);
            box-shadow: 0 0 35px #ff0055;
        }

        .hud-text {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #00f0ff;
            text-shadow: 0 0 8px #00f0ff;
            margin-top: 15px;
        }

        /* Status & Sprach-Display */
        #status-box {
            background: rgba(10, 16, 30, 0.7);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 10px;
            padding: 20px;
            width: 80%;
            max-width: 600px;
            text-align: center;
            backdrop-filter: blur(5px);
            box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.05);
            margin-bottom: 20px;
        }

        #user-speech {
            font-size: 14px;
            color: #8a9ba8;
            margin-bottom: 10px;
            min-height: 20px;
        }

        #jarvis-response {
            font-size: 16px;
            color: #ffffff;
            font-weight: 500;
            min-height: 24px;
        }

        /* Microfon-Control */
        .controls {
            margin-bottom: 20px;
        }

        .mic-btn {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .mic-btn:hover {
            background: #00f0ff;
            color: #050811;
            box-shadow: 0 0 15px #00f0ff;
        }

        /* Rechte Seite: Live Browser Monitor */
        #browser-monitor {
            width: 340px;
            background-color: #0a0e17;
            border-left: 1px solid rgba(0, 240, 255, 0.2);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .monitor-header {
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1.5px;
            color: #8a9ba8;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            padding-bottom: 8px;
        }

        .live-window {
            background: #050811;
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 6px;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            color: #00f0ff;
            height: 100%;
            overflow-y: auto;
            word-break: break-all;
            line-height: 1.5;
        }

        .log-entry {
            margin-bottom: 8px;
            opacity: 0.8;
        }
